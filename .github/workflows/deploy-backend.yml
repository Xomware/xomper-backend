name: Deploy Backend

on:
  push:
    branches: [master]
  workflow_dispatch:
    inputs:
      lambdas:
        description: Comma-separated lambda folders to deploy. Empty rebuilds the layer and deploys all.
        default: ''

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    uses: Xomware/github-actions/.github/workflows/deploy-lambda-python.yml@feature/lambda-function-names
    with:
      app: xomper
      python-version: '3.13'
      test-command: python -m pytest tests -q
      lambdas: ${{ inputs.lambdas }}
      function-names: |
        api_register_device=xomper-api-device-register
        api_unregister_device=xomper-api-device-unregister
        notif_close_game_alert=xomper-notif-close-game-sun xomper-notif-close-game-mon
