name: Deploy Backend

on:
  push:
    branches:
      - master
  workflow_dispatch:
    inputs:
      deploy_all:
        description: 'Deploy every lambda, not just the ones changed in the last commit'
        required: false
        type: boolean
        default: false


# Two pushes close together each build and each update the same lambdas, so
# without this the slower run finishes last and wins - silently reverting the
# newer code. That has already cost a deploy on the frontend side.
#
# cancel-in-progress is deliberately FALSE here, unlike deploy-frontend. A
# frontend deploy is one S3 sync plus an invalidation, so cancelling it is safe
# and the last writer is correct. This workflow updates a matrix of lambda
# functions one at a time; cancelling mid-matrix leaves some on new code and
# some on old, which is worse than either version. Queue instead.
concurrency:
  group: deploy-backend
  cancel-in-progress: false

env:
  AWS_REGION: us-east-1

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      common_changed: ${{ steps.changes.outputs.common }}
      changed_lambdas: ${{ steps.changes.outputs.changed_lambdas }}
      all_lambdas: ${{ steps.all-lambdas.outputs.all_lambdas }}
      has_lambda_changes: ${{ steps.changes.outputs.has_lambda_changes }}
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Detect changes
        id: changes
        run: |
          # Get changed files between current and previous commit
          CHANGED_FILES=$(git diff --name-only HEAD~1 HEAD 2>/dev/null || git diff --name-only HEAD)
          echo "Changed files:"
          echo "$CHANGED_FILES"

          # Check if common layer changed. requirements.txt also forces
          # a layer rebuild — bumping a dep wouldn't otherwise produce a
          # new layer version.
          if echo "$CHANGED_FILES" | grep -qE "^(lambdas/common/|requirements\.txt$)"; then
            echo "common=true" >> $GITHUB_OUTPUT
          else
            echo "common=false" >> $GITHUB_OUTPUT
          fi

          # Find changed lambda folders (excluding common) and format as JSON array
          CHANGED_LAMBDAS=$(echo "$CHANGED_FILES" | grep "^lambdas/" | grep -v "^lambdas/common/" | cut -d'/' -f2 | sort -u | grep -v '^$' || true)

          # A lambda that Terraform created but nobody has edited since is
          # never "changed", so its code is never pushed and it keeps serving
          # the stub -- answering every request with
          # `Runtime.ImportModuleError: No module named 'handler'`. That went
          # unnoticed for as long as the authorizer denied every request
          # before it reached a handler. This switch is the way back.
          if [ "${{ inputs.deploy_all }}" = "true" ]; then
            echo "deploy_all requested — deploying every lambda"
            CHANGED_LAMBDAS=$(ls -d lambdas/*/ | grep -v "lambdas/common" | xargs -n1 basename)
          fi

          if [ -n "$CHANGED_LAMBDAS" ]; then
            # Convert to JSON array
            JSON_ARRAY=$(echo "$CHANGED_LAMBDAS" | jq -R -s -c 'split("\n") | map(select(length > 0))')
            echo "changed_lambdas=$JSON_ARRAY" >> $GITHUB_OUTPUT
            echo "has_lambda_changes=true" >> $GITHUB_OUTPUT
            echo "Changed lambdas: $JSON_ARRAY"
          else
            echo "changed_lambdas=[]" >> $GITHUB_OUTPUT
            echo "has_lambda_changes=false" >> $GITHUB_OUTPUT
            echo "No lambda changes detected"
          fi

      - name: Get all lambda folders
        id: all-lambdas
        run: |
          # List all lambda folders except common and format as JSON array
          ALL_LAMBDAS=$(ls -d lambdas/*/ 2>/dev/null | grep -v "lambdas/common" | xargs -n1 basename | jq -R -s -c 'split("\n") | map(select(length > 0))')
          echo "all_lambdas=$ALL_LAMBDAS" >> $GITHUB_OUTPUT
          echo "All lambdas: $ALL_LAMBDAS"

  test-common:
    needs: detect-changes
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov moto boto3

      - name: Run common tests
        run: |
          pytest \
            tests/test_common.py \
            tests/test_league_lore.py \
            tests/test_claude_helper.py \
            tests/test_ai_reports_store.py \
            tests/test_season_resolver.py \
            tests/test_season_guard.py \
            tests/test_platform_users.py \
            tests/test_platform_follows.py \
            tests/test_social_store.py \
            tests/test_comment_store.py \
            tests/test_admin_gate.py \
            -v --cov=lambdas/common

  test-lambdas:
    needs: detect-changes
    if: needs.detect-changes.outputs.has_lambda_changes == 'true'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        lambda: ${{ fromJson(needs.detect-changes.outputs.changed_lambdas) }}
      fail-fast: false
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov moto boto3

      - name: Run tests for ${{ matrix.lambda }}
        run: |
          if [ -f "tests/test_${{ matrix.lambda }}.py" ]; then
            echo "Running tests for ${{ matrix.lambda }}"
            pytest tests/test_${{ matrix.lambda }}.py -v --cov=lambdas/${{ matrix.lambda }}
          else
            echo "No tests found for ${{ matrix.lambda }}, skipping..."
          fi

  deploy-layer:
    permissions:
      id-token: write # mint the OIDC token traded for the deploy role
      contents: read
    needs: [detect-changes, test-common, test-lambdas]
    if: always() && needs.detect-changes.outputs.common_changed == 'true' && needs.test-common.result == 'success' && (needs.test-lambdas.result == 'success' || needs.test-lambdas.result == 'skipped')
    runs-on: ubuntu-latest
    outputs:
      layer_arn: ${{ steps.deploy-layer.outputs.layer_arn }}
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: us-east-1

      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.13"

      - name: Package layer
        run: |
          mkdir -p python/lambdas
          cp -r lambdas/common python/lambdas/
          python3.13 -m pip install --platform manylinux2014_x86_64 --only-binary=:all: -t python/ -r requirements.txt
          zip -r xomper-shared-packages.zip python

      - name: Deploy layer
        id: deploy-layer
        run: |
          LAYER_OUTPUT=$(aws lambda publish-layer-version \
            --layer-name xomper-shared-packages \
            --zip-file fileb://xomper-shared-packages.zip \
            --compatible-runtimes python3.13 \
            --region $AWS_REGION \
            --output json)

          LAYER_ARN=$(echo $LAYER_OUTPUT | jq -r .LayerVersionArn)
          echo "layer_arn=$LAYER_ARN" >> $GITHUB_OUTPUT
          echo "Published layer: $LAYER_ARN"

  update-all-lambdas-layer:
    permissions:
      id-token: write # mint the OIDC token traded for the deploy role
      contents: read
    needs: [detect-changes, deploy-layer]
    if: always() && needs.detect-changes.outputs.common_changed == 'true' && needs.deploy-layer.result == 'success'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        lambda: ${{ fromJson(needs.detect-changes.outputs.all_lambdas) }}
      fail-fast: false
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: us-east-1

      - name: Update lambda layer configuration
        run: |
          FUNCTION_NAME="xomper-${{ matrix.lambda }}"
          # Convert underscores to hyphens for AWS function names
          FUNCTION_NAME=$(echo $FUNCTION_NAME | tr '_' '-')

          echo "Updating layer for $FUNCTION_NAME"

          # --layers REPLACES the whole list. Any function carrying an extra
          # layer beyond the shared one loses it on every deploy -- which is
          # exactly what happened to xomper-warehouse-ingest and its DuckDB
          # layer. Read the current extras back and pass them through.
          EXTRA_LAYERS=$(aws lambda get-function-configuration \
            --function-name $FUNCTION_NAME \
            --query "Layers[?!contains(Arn, 'xomper-shared-packages')].Arn" \
            --output text --region $AWS_REGION 2>/dev/null | tr '\t' ' ')
          if [ -n "$EXTRA_LAYERS" ]; then
            echo "Preserving extra layers: $EXTRA_LAYERS"
          fi

          # `|| echo` here swallowed EVERY failure and reported success. An
          # AccessDenied on the duckdb layer printed "not found, skipping..."
          # -- a message that was simply false, for a function that exists --
          # and three green deploys left api-values-compute on a stale shared
          # layer. Tolerate a genuinely absent function; fail on anything else.
          set -o pipefail
          if ! ERR=$(aws lambda update-function-configuration \
            --function-name $FUNCTION_NAME \
            --layers ${{ needs.deploy-layer.outputs.layer_arn }} $EXTRA_LAYERS \
            --region $AWS_REGION 2>&1); then
            if echo "$ERR" | grep -q "ResourceNotFoundException"; then
              echo "Function $FUNCTION_NAME does not exist yet, skipping."
            else
              echo "::error::Updating layers for $FUNCTION_NAME failed: $ERR"
              exit 1
            fi
          fi

  deploy-changed-lambdas:
    permissions:
      id-token: write # mint the OIDC token traded for the deploy role
      contents: read
    # update-all-lambdas-layer is in `needs` for sequencing, not for data: a
    # commit touching both lambdas/common/ and one handler had both jobs call
    # UpdateFunctionConfiguration on the same function at once, and the loser
    # got ResourceConflictException. That left notif-lineup-not-set with new
    # code on an old layer -- new code importing a module the layer did not
    # have yet, which is an ImportModuleError at the next invocation, not a
    # failed deploy anyone would notice.
    needs: [detect-changes, test-lambdas, deploy-layer, update-all-lambdas-layer]
    if: always() && needs.detect-changes.outputs.has_lambda_changes == 'true' && (needs.test-lambdas.result == 'success' || needs.test-lambdas.result == 'skipped') && (needs.update-all-lambdas-layer.result == 'success' || needs.update-all-lambdas-layer.result == 'skipped')
    runs-on: ubuntu-latest
    strategy:
      matrix:
        lambda: ${{ fromJson(needs.detect-changes.outputs.changed_lambdas) }}
      fail-fast: false
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: us-east-1

      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.13"

      - name: Package lambda
        run: |
          cd lambdas/${{ matrix.lambda }}
          zip -r ../../${{ matrix.lambda }}.zip *

      - name: Deploy lambda code
        run: |
          # Resolve the real AWS function name(s) for this handler dir.
          # Almost every handler deploys 1:1 as `xomper-<dir-dashed>` (the
          # terraform `name` equals the handler_dir dashed). A few handler
          # dirs map to MULTIPLE functions with bespoke terraform names — e.g.
          # `notif_close_game_alert` builds BOTH `xomper-notif-close-game-sun`
          # and `xomper-notif-close-game-mon` (separate Sun/Mon schedules).
          # The old 1:1 derivation produced `xomper-notif-close-game-alert`,
          # a phantom function, so close_game code never deployed. Override
          # the mapping for those cases; default everything else to 1:1.
          #
          # The device pair is a different mismatch: the handler dirs are
          # verb-first (`api_register_device`) but terraform named the
          # functions noun-first (`xomper-api-device-register`). The 1:1
          # derivation produced `xomper-api-register-device`, which does not
          # exist, so the iOS push-registration endpoints have never had code
          # deployed and have always answered ImportModuleError.
          case "${{ matrix.lambda }}" in
            notif_close_game_alert)
              TARGET_FUNCTIONS="xomper-notif-close-game-sun xomper-notif-close-game-mon" ;;
            api_register_device)
              TARGET_FUNCTIONS="xomper-api-device-register" ;;
            api_unregister_device)
              TARGET_FUNCTIONS="xomper-api-device-unregister" ;;
            *)
              TARGET_FUNCTIONS="xomper-$(echo '${{ matrix.lambda }}' | tr '_' '-')" ;;
          esac

          for FUNCTION_NAME in $TARGET_FUNCTIONS; do
            echo "Deploying code for $FUNCTION_NAME"

            # Confirm the function exists; bail ONLY if it genuinely doesn't
            # (terraform hasn't created it yet). Do NOT hard-gate on
            # State=Active: an `Inactive` (offseason-idled) or `Failed` function
            # would deadlock, since the update-function-code below is what
            # reactivates/recovers it.
            STATE=$(aws lambda get-function-configuration \
              --function-name $FUNCTION_NAME --region $AWS_REGION \
              --query 'State' --output text 2>/dev/null || echo "MISSING")
            if [ "$STATE" = "MISSING" ]; then
              echo "::error::Lambda $FUNCTION_NAME does not exist — terraform may not have created it yet. Rerun after the terraform workflow completes."
              exit 1
            fi
            echo "Current state: $STATE — proceeding (update reactivates Inactive / recovers Failed)."
            # Best-effort settle if mid-update (Pending). Never hard-fail —
            # the ResourceConflictException retry loop below is the real guard.
            aws lambda wait function-active --function-name $FUNCTION_NAME --region $AWS_REGION 2>/dev/null || true

            # Retry the code update on ResourceConflictException up to 3 times.
            for attempt in 1 2 3; do
              if aws lambda update-function-code \
                --function-name $FUNCTION_NAME \
                --zip-file fileb://${{ matrix.lambda }}.zip \
                --region $AWS_REGION 2>&1 | tee /tmp/upd-$FUNCTION_NAME-$attempt.log; then
                break
              fi
              if ! grep -q "ResourceConflictException" /tmp/upd-$FUNCTION_NAME-$attempt.log; then
                echo "::error::Lambda code update failed (non-retryable)"
                exit 1
              fi
              echo "ResourceConflictException on attempt $attempt — sleeping $((attempt * 10))s before retry"
              sleep $((attempt * 10))
            done

            echo "Waiting for function update to complete..."
            aws lambda wait function-updated --function-name $FUNCTION_NAME --region $AWS_REGION

            # If layer was updated, also update config (after code update completes).
            if [ "${{ needs.deploy-layer.outputs.layer_arn }}" != "" ]; then
              echo "Updating layer configuration for $FUNCTION_NAME"

              # See the note in update-all-lambdas-layer: --layers replaces the
              # whole list, so extras have to be read back and passed through.
              EXTRA_LAYERS=$(aws lambda get-function-configuration \
                --function-name $FUNCTION_NAME \
                --query "Layers[?!contains(Arn, 'xomper-shared-packages')].Arn" \
                --output text --region $AWS_REGION 2>/dev/null | tr '\t' ' ')
              if [ -n "$EXTRA_LAYERS" ]; then
                echo "Preserving extra layers: $EXTRA_LAYERS"
              fi

              # Same retry the code update above already has. Sequencing the
              # jobs removes the known collision; this covers a lock held by
              # something outside this workflow, such as a terraform apply.
              for attempt in 1 2 3; do
                if aws lambda update-function-configuration \
                  --function-name $FUNCTION_NAME \
                  --layers ${{ needs.deploy-layer.outputs.layer_arn }} $EXTRA_LAYERS \
                  --region $AWS_REGION > /tmp/cfg-$FUNCTION_NAME.log 2>&1; then
                  break
                fi
                if ! grep -q "ResourceConflictException" /tmp/cfg-$FUNCTION_NAME.log; then
                  cat /tmp/cfg-$FUNCTION_NAME.log
                  echo "::error::Layer configuration update failed for $FUNCTION_NAME (non-retryable)"
                  exit 1
                fi
                if [ "$attempt" = "3" ]; then
                  cat /tmp/cfg-$FUNCTION_NAME.log
                  echo "::error::Layer configuration for $FUNCTION_NAME still locked after 3 attempts"
                  exit 1
                fi
                echo "ResourceConflictException on attempt $attempt — sleeping $((attempt * 10))s before retry"
                sleep $((attempt * 10))
              done
              echo "Waiting for configuration update to complete..."
              aws lambda wait function-updated --function-name $FUNCTION_NAME --region $AWS_REGION
            fi

            echo "✅ $FUNCTION_NAME deployment complete"
          done

  summary:
    needs:
      [
        detect-changes,
        deploy-layer,
        update-all-lambdas-layer,
        deploy-changed-lambdas,
      ]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Deployment summary
        run: |
          echo "=== Deployment Summary ==="
          echo "Common layer changed: ${{ needs.detect-changes.outputs.common_changed }}"
          echo "Changed lambdas: ${{ needs.detect-changes.outputs.changed_lambdas }}"
          if [ "${{ needs.deploy-layer.outputs.layer_arn }}" != "" ]; then
            echo "New layer ARN: ${{ needs.deploy-layer.outputs.layer_arn }}"
          fi
          echo "=========================="
